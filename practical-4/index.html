<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1> This is a Form Page</h1>
    <form method="post">
        <div>
            <label for="username"> Username:</label>
            <input id="username" type="text" name="username" placeholder="Enter Your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="checkbox" name="subscribe" value="yes">
            <label for="checkbox"> Subscribe</label>
        </div>
        <div>
            <textarea id="message" name="message" rows="5" cols="30" placeholder="Enter your message"></textarea>
        </div>
        <div>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value=""> select a country:</option>
            <option value="usa">USA</option>
            <option value="spain">SPAIN</option>
            <option value="england">ENGLAND</option>
        </select>
        </div>
        <input type="submit" value="submit">
    </form>
</body>

</html>
