<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms2</title>
</head>

<body>
    <h1> User Data Collection</h1>
    <form method="post">
        <div>
            <label for="name"> Name:</label>
            <input type="text" name="Name" id="name" placeholder="Enter your name" required>
        </div>
        <div>
            <label> Gender:</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="phn"> Mobile:</label>
            <input type="tel" name="mobile" id="phn" placeholder="Enter your mobile number" pattern="[0-9]{10}">
        </div>
        <div>
            <label for="email"> E-Mail:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email">
        </div>
        <div>
            <label for="pass">Password:</label>
            <input type="password" name="password" id="pass" placeholder="Enter your pasword" minlength="8">
        </div>
        <input type="submit" value="submit">
    </form>
</body>

</html>
