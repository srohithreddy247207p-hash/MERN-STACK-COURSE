<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
            background-color:rgb(201, 206, 180);
            height: 70px;
        }
        main{
            background-color:beige;
            color:rgb(0, 0, 0);
            padding:34px;
        }
        .container{
            background-color:rgb(194, 124, 159);
            margin: 12px 34px;
            padding: 55px 23px;
            text-align:center;
        }
        .box1{
            background-color:rgb(187, 113, 209);
            width: 45%;
            height: 70vh;
            margin:  0px 12px; 
            display:inline-block;
        }
        .box2{
            background-color:rgb(93, 255, 255);
            width: 45%;
            height: 70vh;
            margin:  0px 12px; 
            display:inline-block;
        }
        .text-box{
            padding:34px;
            border:2px solid rgb(255, 255, 255);
            margin: 50px 34vw;
            font-size:2em;
            border-radius:15px;
        }
        .orange-box{
            background:coral;
            width: 32px;
            height: 32px;
            position:fixed;
            bottom: 12px;
            right: 23px;
            border-radius:50%;
        }
        footer{
            background-color:rgb(201, 206, 180);
            height: 70px;
        }
    </style>
</head>
<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
            <div class="container">
                <div class="box1">

                </div>
                <div class="box2">

                </div>
                <div class="text-box">
                    <p>This is some text content.</p>
                </div>
                <div class="orange-box">

                </div>
            </div>
    </main>
    <footer>

    </footer>
</body>
</html>
