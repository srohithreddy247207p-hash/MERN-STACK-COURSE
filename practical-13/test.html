        @keyframes myanimation{
            from{
                transform: translateY(900px);
            }
            to{

            }

        @keyframes myanimation2{
            from{

            }
            to{
             transform: translateY(900px);
            }
        }
    </style>
</head>

        <div class="b Z"></div>
