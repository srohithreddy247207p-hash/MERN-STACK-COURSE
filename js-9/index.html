<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child {
            background-color: antiquewhite;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }

        .childcontainer {
            background-color: gold;
            margin: 14px;
            padding: 14px;
            border: 2px solid black;
        }

        .container {
            background-color: rgb(242, 242, 3);
            margin: 14px;
            padding: 14px;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                I am a child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", e => {
            e.stopPropagation()
            alert("child was clicked")
        })
        document.querySelector(".childcontainer").addEventListener("click", e => {
            e.stopPropagation()
            alert("⚽⚽⚽⚽⚽⚽⚽⚽⚽⚽⚽")
        })
        document.querySelector(".container").addEventListener("click", e => {
            alert("👻👻👻👻👻👻👻👻👻👻👻👻")
        })

        function getRandomColor() {
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1},${val2},${val3})`
        }
        // let a = setInterval(()=>{
        //     document.querySelector(".childcontainer").style.background=getRandomColor();
        //     document.querySelector(".container").style.background=getRandomColor();

        // },1000);
        // let b = setInterval(()=>{
        //     document.querySelector(".child").style.color=getRandomColor();
        //      document.querySelector(".child").style.background=getRandomColor();

        // },1000);
        let a = setTimeout(() => {
            document.querySelector(".child").style.background = getRandomColor();
        }, 2000)
    </script>
</body>

</html>
