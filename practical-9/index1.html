<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box&Text shadow</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px gray;
            margin-bottom: 35px;
        }
        .box2{
            border: 2px solid coral;
            padding: 35px;
            box-shadow: inset 0px 0px 20px 10px coral;
        }
        .text-shadow{
            text-shadow: 5px 15px 5px ;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box

    </div> 

    <div class=" box box2">
        I am another box
    </div>
    <p class="text-shadow">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam, velit.</p>
</body>
</html>
