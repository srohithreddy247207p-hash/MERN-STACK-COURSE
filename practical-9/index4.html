<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css positions</title>
    <style> 
    *{
        margin: 0px;
        padding: 0px;
    }
    .box{
        height: 433px;
        width: 80vw;
        padding: 3px;
        margin: 3px;
        border: 2px solid;
    }
    .box1{
        background-color: blue;
        position: sticky;
        top: 0px;
        height: 111px;
        width: 100%;
        margin: 0px;
        padding: 0px;
        /* position: absolute;
        top: 0px;
        left: 30px; */
    }
    .box2{
        background-color: blanchedalmond;
        position: relative;
        top: 34px;
        left: 56px;
    }
    .box3{
        background-color: blueviolet;
        position: fixed;
        bottom: 0px;
        left: 8vw;
        height: 111px;
    }
    .box4{
        background-color: brown;
    }
    .parent{
        padding: 43px;
        margin: 34px;
        border: 2px solid ;
        position: relative;
        transform: translate(0);
        filter: invert( 0);
    }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
