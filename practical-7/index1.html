<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box-Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: rgb(241, 241, 36);
        }

        .box1 {
            color: red;
            padding: 10px;
            margin: 20px;
            border: 2px solid;
            height: 20px;
        }

        .box2 {
            color: green;
            padding: 10px;
            margin: 20px;
            border: 2px solid;
            height: 20px;
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="box box1">
        I am a Box.
    </div>
    <div class="box box2">
        I am another box.
    </div>
</body>

</html>
